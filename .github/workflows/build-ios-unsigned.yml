name: Build ZA-DIGI Rouge iOS (Unsigned IPA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout cloud-builder repository
        uses: actions/checkout@v6

      - name: Show macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          df -h

      - name: Clone ZA-DIGI Rouge with assets/locales submodules
        run: |
          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            --branch main \
            https://github.com/ZA-Digi-Rouge-Custom/ZA-DIGI-Rouge.git \
            game
          test -d game/assets/images
          test -d game/locales/en

      - name: Apply v14 offline/custom patches
        run: |
          rsync -a patch/ game/
          echo "Applied patch files:"
          find patch -type f | sort

      - name: Apply iOS v17.2 PRSV and memory fixes
        working-directory: game
        run: python3 ../PATCH_IOS_V17_2.py

      - name: Verify iOS PRSV picker patch
        working-directory: game
        run: |
          echo "===== GAME DATA IMPORT SECTION ====="
          sed -n '1465,1635p' src/system/game-data.ts
          echo "===== VERIFY PRSV PICKER ====="
          grep -n -E 'saveFile.accept|appendChild\(saveFile\)|saveFile.click|FileReader|readAsText|style.opacity' \
            src/system/game-data.ts

      - name: Apply iOS AJV compatibility fix
        working-directory: game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/data/daily-seed/daily-seed-utils.ts")
          s = p.read_text()
          old = "const ajv = new Ajv({\n  allErrors: true,\n});"
          if "strictSchema: false" in s:
              print("AJV compatibility fix already present")
          elif old in s:
              new = "const ajv = new Ajv({\n  allErrors: true,\n  strictSchema: false,\n});"
              p.write_text(s.replace(old, new, 1))
              print("iOS AJV compatibility fix applied")
          else:
              raise SystemExit("ERROR: AJV block not found")
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: 'npm'
          cache-dependency-path: game/package-lock.json

      - name: Install web dependencies
        working-directory: game
        run: npm ci

      - name: Install Capacitor iOS 7.4.2 for this build
        working-directory: game
        run: npm install --no-save --package-lock=false @capacitor/ios@7.4.2

      - name: Build offline web app
        working-directory: game
        run: npm run build:app

      - name: Package all offline game assets into dist
        working-directory: game
        run: |
          rsync -a assets/ dist/
          test -d dist/images
          test -d dist/audio
          test -d dist/fonts
          test -d dist/battle-anims
          test -f dist/index.html
          du -sh dist

      - name: Add Capacitor iOS platform using Swift Package Manager
        working-directory: game
        run: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios

      - name: Configure iPhone landscape/fullscreen defaults
        working-directory: game
        run: |
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST"
          plutil -lint "$PLIST"

      - name: Resolve Swift packages
        working-directory: game
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build unsigned iPhone app
        working-directory: game
        run: |
          rm -rf ios-build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Create unsigned IPA container
        working-directory: game
        run: |
          APP_PATH="$(find "$PWD/ios-build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found"
            exit 1
          fi
          rm -rf ipa-out
          mkdir -p ipa-out/Payload
          cp -R "$APP_PATH" ipa-out/Payload/
          (
            cd ipa-out
            zip -qry ../ZA-DIGI-Rouge-v17.2-unsigned.ipa Payload
          )
          ls -lh ZA-DIGI-Rouge-v17.2-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZA-DIGI-Rouge-v17.2-iOS-unsigned
          path: game/ZA-DIGI-Rouge-v17.2-unsigned.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
