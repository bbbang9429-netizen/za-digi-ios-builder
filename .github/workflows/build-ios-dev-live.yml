name: Build ZA-DIGI Rouge iOS DEV Live Reload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-dev:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout iOS builder repository
        uses: actions/checkout@v6

      - name: Show macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          df -h

      - name: Clone ZA-DIGI Rouge
        run: |
          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            --branch main \
            https://github.com/ZA-Digi-Rouge-Custom/ZA-DIGI-Rouge.git \
            game
          test -d game/assets/images
          test -d game/locales/en

      - name: Apply v14 offline/custom patches
        run: |
          rsync -a patch/ game/

      - name: Apply iOS v17.2 prerequisite picker patch
        working-directory: game
        run: python3 ../PATCH_IOS_V17_2.py

      - name: Apply iOS v17.3 native PRSV picker
        working-directory: game
        run: python3 ../PATCH_IOS_V17_3.py

      - name: Apply iOS v17.4.1 direct native picker fix
        working-directory: game
        run: python3 ../PATCH_IOS_V17_4_1.py

      - name: Apply iOS v17.5 final PRSV import fix
        working-directory: game
        run: python3 ../PATCH_IOS_V17_5.py

      - name: Apply iOS AJV compatibility fix
        working-directory: game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/data/daily-seed/daily-seed-utils.ts")
          s = p.read_text()
          old = "const ajv = new Ajv({\n  allErrors: true,\n});"
          if "strictSchema: false" in s:
              print("AJV compatibility fix already present")
          elif old in s:
              new = "const ajv = new Ajv({\n  allErrors: true,\n  strictSchema: false,\n});"
              p.write_text(s.replace(old, new, 1))
              print("iOS AJV compatibility fix applied")
          else:
              raise SystemExit("ERROR: AJV block not found")
          PY

      - name: Configure ZA-DIGI DEV Live Reload
        working-directory: game
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "net.pokerogue.allinone.dev",
            appName: "ZA-DIGI DEV",
            webDir: "dist",
            server: {
              url: "http://192.168.50.138:5173",
              cleartext: true,
              androidScheme: "https",
              allowNavigation: ["192.168.50.138"],
            },
          };

          export default config;
          EOF

          echo "===== DEV CAPACITOR CONFIG ====="
          cat capacitor.config.ts

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: 'npm'
          cache-dependency-path: game/package-lock.json

      - name: Install web dependencies
        working-directory: game
        run: npm ci

      - name: Install iOS native dependencies
        working-directory: game
        run: |
          npm install --save-exact --package-lock=false \
            @capacitor/ios@7.4.2 \
            @capawesome/capacitor-file-picker@7.2.0

          npm ls @capacitor/ios @capawesome/capacitor-file-picker --depth=0
          test -d node_modules/@capacitor/ios
          test -d node_modules/@capawesome/capacitor-file-picker

      - name: Build fallback web app
        working-directory: game
        run: |
          npm run build:app
          rsync -a assets/ dist/
          test -f dist/index.html

      - name: Add Capacitor iOS platform
        working-directory: game
        run: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios

      - name: Configure iOS DEV networking and fullscreen
        working-directory: game
        run: |
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST"

          # DEV only: permit HTTP connection to the PC Vite server.
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

          # iOS local-network privacy explanation for the DEV server.
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string ZA-DIGI DEV connects to your PC development server for live testing." "$PLIST"

          plutil -lint "$PLIST"

      - name: Verify DEV server URL and FilePicker
        working-directory: game
        run: |
          grep -n "192.168.50.138:5173" capacitor.config.ts
          npx cap ls ios || true
          grep -Rni "FilePicker\|Capawesome\|capacitor-file-picker" ios 2>/dev/null | head -100 || true

      - name: Resolve Swift packages
        working-directory: game
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build unsigned DEV iPhone app
        working-directory: game
        run: |
          rm -rf ios-build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Create unsigned DEV IPA
        working-directory: game
        run: |
          APP_PATH="$(find "$PWD/ios-build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found"
            exit 1
          fi

          rm -rf ipa-out
          mkdir -p ipa-out/Payload
          cp -R "$APP_PATH" ipa-out/Payload/

          (
            cd ipa-out
            zip -qry ../ZA-DIGI-Rouge-DEV-Live-unsigned.ipa Payload
          )

          ls -lh ZA-DIGI-Rouge-DEV-Live-unsigned.ipa

      - name: Upload unsigned DEV IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZA-DIGI-Rouge-DEV-Live-iOS-unsigned
          path: game/ZA-DIGI-Rouge-DEV-Live-unsigned.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
